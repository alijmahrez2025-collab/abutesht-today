<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة أبوتشت اليوم</title>

<style>
body{
font-family:Tahoma;
background:#f5f5f5;
padding:20px;
direction:rtl;
}

.box{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
box-sizing:border-box;
}

textarea{
height:150px;
resize:none;
}

button{
width:100%;
padding:15px;
background:#d60000;
color:#fff;
border:none;
font-size:18px;
cursor:pointer;
border-radius:8px;
}

button:hover{
background:#b50000;
}
</style>

</head>

<body>

<div class="box">

<h2>إضافة خبر جديد</h2>

<input type="text" id="title" placeholder="عنوان الخبر">

<textarea id="details" placeholder="تفاصيل الخبر"></textarea>

<input type="text" id="image" placeholder="رابط الصورة">

<button id="publishBtn">نشر الخبر</button>

</div>

<script>
alert("admin.html شغال");
</script>
</body>
</html>
